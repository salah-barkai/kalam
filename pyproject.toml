[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kalam"
version = "0.1.0"
description = "Langage de programmation en arabe tchadien (écriture latine)"
readme = "README.md"
requires-python = ">=3.8"

[project.scripts]
kalam = "kalam.__main__:main"

[tool.setuptools]
packages = ["kalam"]

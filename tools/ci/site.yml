name: Tests et site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Installer les outils
        run: npm ci

      - name: Tests (langage, vérificateur, programmes du cours, ligne de commande)
        run: npm test

      - name: Polices pour le PDF
        run: sudo apt-get install -y --no-install-recommends fonts-noto-core fonts-dejavu-core

      - name: Construire le site et le cours PDF
        run: node tools/build-site.js --browser /usr/bin/google-chrome

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
